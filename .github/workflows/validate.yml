name: Validate catalog repository

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s LICENSES.md
          test -s NOTICE
          test -s ATTRIBUTION
          if find . -type f -not -path './.git/*' -print0 | xargs -0 grep -Il $'\t' | grep -q .; then
            echo "Tabulatoren sind in Textdateien nicht zulässig." >&2
            exit 1
          fi

      - name: Checkout pinned LearnPip contract
        uses: actions/checkout@v4
        with:
          repository: kennfarbe/LearnPip
          ref: 13270a7cae206980560040770cacd62e0252129e
          path: .contract/learnpip
          persist-credentials: false

      - name: Verify, build and validate catalog
        shell: bash
        run: |
          set -euo pipefail
          source_zip="source/PruefungsfragenZIP.zip"
          expected_sha="082fbf8de303d4ceafc57b9d5f15f211d08a2e24f3629b66c7e061abcb52bee4"

          test -f "$source_zip"
          echo "$expected_sha  $source_zip" | sha256sum --check --strict

          python3 -m py_compile             scripts/import-bnetza.py             scripts/validate-release.py             scripts/validate-bnetza-content.py             tests/test-import.py

          python3 scripts/import-bnetza.py             "$source_zip"             build/catalog             --catalog-version 1.0.0

          package="build/de.bnetza.amateurfunk.pruefungsfragen-1.0.0.zip"
          test -f "$package"

          python3 scripts/validate-release.py "$package"
          python3 scripts/validate-bnetza-content.py "$package"
          python3 .contract/learnpip/scripts/validate-catalog.py "$package"
          python3 tests/test-import.py "$source_zip"
