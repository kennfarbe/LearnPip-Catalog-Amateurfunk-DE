name: Release catalog

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout pinned LearnPip contract
        uses: actions/checkout@v4
        with:
          repository: kennfarbe/LearnPip
          ref: 13270a7cae206980560040770cacd62e0252129e
          path: .contract/learnpip
          persist-credentials: false

      - name: Verify pinned BNetzA source
        shell: bash
        run: |
          set -euo pipefail
          source_zip="source/PruefungsfragenZIP.zip"
          expected_sha="082fbf8de303d4ceafc57b9d5f15f211d08a2e24f3629b66c7e061abcb52bee4"
          test -f "$source_zip"
          echo "$expected_sha  $source_zip" | sha256sum --check --strict

      - name: Build release package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             scripts/import-bnetza.py             scripts/validate-release.py             scripts/validate-bnetza-content.py             tests/test-import.py

          version="${GITHUB_REF_NAME#v}"
          python3 scripts/import-bnetza.py             source/PruefungsfragenZIP.zip             build/catalog             --catalog-version "$version"

          package="build/de.bnetza.amateurfunk.pruefungsfragen-${version}.zip"
          test -f "$package"
          echo "path=$package" >> "$GITHUB_OUTPUT"

      - name: Validate release package
        shell: bash
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          python3 scripts/validate-release.py "$PACKAGE" > validation-report.txt
          python3 scripts/validate-bnetza-content.py "$PACKAGE" >> validation-report.txt
          python3 .contract/learnpip/scripts/validate-catalog.py "$PACKAGE" >> validation-report.txt
          python3 tests/test-import.py source/PruefungsfragenZIP.zip >> validation-report.txt

      - name: Create SHA-256 file
        shell: bash
        env:
          PACKAGE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          sha256sum "$PACKAGE" > SHA256SUMS

      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             "$PACKAGE" SHA256SUMS validation-report.txt             --verify-tag             --title "$GITHUB_REF_NAME"             --generate-notes
